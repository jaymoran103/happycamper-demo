<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download HappyCamper</title>
<link rel="icon" href="icon.png">
<style>
/* Shared by prototypes C onward: J's header bar and footer, the page column,
 * and the round's letter strip. Each prototype overrides the tokens. */
:root {
  --bar: #1a672c; --bar-ink: #ffffff;
  --page: #cfe3c9; --ink: #26302a; --soft: #43524a; --faint: #5f6f63;
  --accent: #1a672c; --accent-ink: #ffffff; --link: #2f7340;
  --panel: #bbd6b4; --panel-edge: #a3c49b; --well: #e3f0df;
  --web: #2b68b8;
}
* { box-sizing: border-box; }
html, body { background: var(--page); }
body { margin: 0; color: var(--ink); font: 16px/1.6 Verdana, Geneva, sans-serif; }
a { color: var(--link); }
:focus-visible { outline: 3px solid #2b68b8; outline-offset: 2px; }
.page { width: min(46rem, 100%); margin: 0 auto; padding: 0 1.25rem 3rem; }
.ic { display: inline-block; vertical-align: middle; }
h1 { margin: 2.25rem 0 0; font-size: 1.9rem; line-height: 1.2; }
code { font-size: .85em; background: rgba(0,0,0,.07); padding: .05rem .3rem; border-radius: 4px; }

/* J's header bar */
.bar { position: sticky; top: 0; z-index: 10; background: var(--bar); box-shadow: 0 2px 8px rgba(20,60,30,.25); }
.bar .in { width: min(1120px, 100%); margin: 0 auto; padding: .5rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.bar .home { display: flex; align-items: center; gap: .6rem; color: var(--bar-ink); text-decoration: none; font-weight: 700; font-size: 1.1rem; }
.bar .home img { width: 36px; height: 36px; }
.bar nav { display: flex; gap: .35rem; font-size: .82rem; font-weight: 700; }
.bar nav a, .bar nav span { padding: .3rem .85rem; border-radius: 999px; text-decoration: none; }
.bar nav a { color: var(--bar-ink); border: 1px solid rgba(255,255,255,.45); }
.bar nav a:hover { background: rgba(255,255,255,.15); }
.bar nav span { color: var(--bar); background: #fff; border: 1px solid #fff; }
@media (max-width: 520px) { .bar .home span { display: none; } .bar nav a, .bar nav span { padding: .25rem .6rem; } }

/* J's footer */
footer.sitefoot { margin-top: 3rem; padding-top: 2rem; text-align: center; font-size: .85rem; color: var(--soft); }
footer.sitefoot a { color: inherit; }
footer.sitefoot div + div { margin-top: .6rem; }
.footpills { display: inline-flex; gap: .35rem; font-size: .82rem; font-weight: 700; }
footer.sitefoot .footpills a { padding: .2rem .85rem; border-radius: 999px; text-decoration: none; color: var(--link); border: 1px solid var(--link); }
footer.sitefoot .footpills a:hover { color: var(--page); background: var(--link); }

/* What's new: the pill from the original page */
details.whatsnew summary { display: inline-flex; align-items: center; gap: .35rem; font-size: .78rem; font-weight: 700; color: var(--link);
  border: 1px solid currentColor; border-radius: 999px; padding: .15rem .8rem; cursor: pointer; list-style: none; user-select: none; }
details.whatsnew summary::-webkit-details-marker { display: none; }
details.whatsnew summary::after { content: "▸"; font-size: .65rem; }
details.whatsnew[open] summary::after { content: "▾"; }
details.whatsnew ul { list-style: none; margin: .5rem 0 0; padding: 0; }
details.whatsnew li { position: relative; padding-left: 1.2rem; margin: .2rem 0; font-size: .88rem; line-height: 1.45; }
details.whatsnew li::before { content: "+"; position: absolute; left: 0; color: var(--link); font-weight: 700; }

/* Round chrome: the ui-iterator letter strip. Not part of the site. */
.proto-bar { display: flex; flex-wrap: wrap; gap: .3rem .8rem; align-items: center; padding: .35rem 1.25rem; font: 12px/1.4 system-ui, sans-serif; background: #22302a; color: #dfe9dd; }
.proto-bar span { flex: 1; min-width: 12rem; opacity: .75; }
.proto-bar nav { display: flex; gap: .3rem; }
.proto-bar a { color: #fff; padding: 0 .4rem; border-radius: 3px; }
.proto-bar a[aria-current] { background: rgba(255,255,255,.18); }
</style>
<style>
/* Shared by I onward: J's green paper, A's centered hero, G's module and
 * step band. Each iteration adds only its OS picker and its sample rosters. */
:root { --mod: #e6f1e2; --mod-edge: #a3c49b; --pic-bg: #f4f9f2; --blue: #2b68b8; --blue-soft: #dfeaf6; --blue-edge: #9ab8dc; }
.page { width: min(52rem, 100%); }

/* A's hero */
.hero { text-align: center; margin-top: 2rem; }
.hero img { width: 110px; height: 110px; }
.hero h1 { margin: .8rem 0 0; font-size: 2.2rem; line-height: 1.2; }
.hero .version { margin: .45rem 0 0; font-size: .95rem; font-weight: 700; color: var(--link); }
.hero details.whatsnew { margin: .45rem 0 0; }
.hero details.whatsnew ul { display: inline-block; text-align: left; }
@media (max-width: 520px) { .hero h1 { font-size: 1.8rem; } }

/* G's module */
.mod { position: relative; display: grid; justify-items: center; gap: .1rem; padding: .9rem .7rem .8rem; background: var(--mod); border: 1.5px solid var(--mod-edge); border-radius: 12px; }
.mod .badge { position: absolute; top: -.6rem; padding: 0 .5rem; font-size: .64rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--accent); border-radius: 999px; }
.mod > .ic { width: 34px; height: 25px; color: var(--accent); margin-bottom: .25rem; }
.mod b { font-size: .95rem; }
.mod small { font-size: .74rem; color: var(--faint); }
a.dl { display: inline-flex; align-items: center; gap: .4rem; margin-top: .55rem; padding: .45rem 1.1rem; border-radius: 8px; background: var(--accent); color: #fff; font-size: .88rem; font-weight: 700; text-decoration: none; }
a.dl:hover { filter: brightness(1.12); }
a.dl .ic { width: 16px; height: 16px; }

/* Sample rosters: the blue family */
.ros { color: var(--blue); }
.ros svg.csv { width: 22px; height: 26px; vertical-align: middle; }

/* G's step band */
.how { margin: 1.4rem 0 0; padding: .9rem 1rem; background: var(--panel); border-radius: 12px; }
.how h2 { margin: 0 0 .6rem; font-size: .95rem; }
ol.strip { list-style: none; margin: 0; padding: 0; display: flex; align-items: flex-start; gap: .2rem; }
ol.strip li { flex: 1; text-align: center; font-size: .76rem; line-height: 1.3; }
ol.strip li + li::before { content: "›"; float: left; margin: 1.3rem 0 0 -.45rem; color: var(--faint); font-size: 1.1rem; }
ol.strip .pic { display: block; width: 100%; max-width: 88px; height: auto; margin: 0 auto .3rem; background: var(--pic-bg); border-radius: 6px; }
ol.strip .gate .pic { outline: 2px solid #f0b429; }
.how p { margin: .7rem 0 0; font-size: .8rem; color: var(--soft); }
@media (max-width: 640px) { ol.strip { flex-wrap: wrap; } ol.strip li { flex: 0 0 30%; } ol.strip li::before { display: none; } }
</style>
<style>
  .acc { display: flex; gap: .5rem; margin: 1.8rem auto 0; max-width: 36rem; }
  .acc .mod { flex: 1; min-width: 0; padding: .7rem .3rem; cursor: pointer; transition: flex .2s ease; }
  .acc .mod.open { flex: 4; padding: 1.1rem .7rem .8rem; cursor: default; border-color: var(--accent); }
  .acc .mod .more, .acc .mod .full, .acc .mod.open .short { display: none; }
  .acc .mod.open .more { display: contents; }
  .acc .mod.open .full { display: block; }
  .acc .mod .short { font-size: .76rem; text-align: center; line-height: 1.25; }
  .acc .mod:not(.open):hover { background: rgba(255,255,255,.4); }
  .acc .file { font-size: .72rem; color: var(--faint); margin-top: .3rem; }
  @media (max-width: 560px) { .acc { flex-wrap: wrap; } .acc .mod.open { flex: 1 1 100%; order: -1; } }

  .signs { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin: 2rem 0 0; }
  .signs a { display: flex; align-items: center; gap: .8rem; padding: .75rem .9rem; border-radius: 12px; text-decoration: none; color: var(--ink); background: var(--mod); border: 1.5px solid var(--mod-edge); }
  .signs a.demo { background: var(--blue-soft); border-color: var(--blue-edge); }
  .signs a:hover { filter: brightness(1.04); border-color: var(--accent); }
  .signs a.demo:hover { border-color: var(--blue); }
  .signs .ic { flex: none; width: 28px; height: 28px; color: var(--accent); }
  .signs .demo .ic { color: var(--blue); }
  .signs b { display: block; font-size: .92rem; }
  .signs .demo b { color: var(--blue); }
  .signs span { font-size: .8rem; color: var(--soft); }
  @media (max-width: 600px) { .signs { grid-template-columns: 1fr; } }

  .acc .mod.open { background: #f4f9f2; border: 2.5px solid var(--accent); }
  .acc .mod.mine.open { box-shadow: 0 0 0 5px rgba(26,103,44,.2); }
  .acc .mod.mine:not(.open) { border: 2px dashed var(--accent); }
  .acc .mod .badge { font-size: .66rem; padding: .05rem .6rem; }
  .acc .guess { display: flex; align-items: center; gap: .3rem; margin-top: .55rem; font-size: .7rem; color: var(--faint); }
  .acc .guess .ic { width: 13px; height: 13px; color: var(--accent); }
  .acc .mod:not(.open) .guess { display: none; }
  .signs { grid-template-columns: repeat(3, 1fr); }
  .signs a.ros .csv { flex: none; width: 26px; height: 31px; }
  @media (max-width: 720px) { .signs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header data-bar></header>
<div class="page">
  <main>
    <div class="hero">
      <img src="icon.png" alt="HappyCamper logo">
      <h1>HappyCamper</h1>
      <p class="version"><span data-version="Version ">Version 2.5.0</span><span data-reldate=" – "></span></p>
      <details class="whatsnew" data-whatsnew><summary>See what's new in <span data-whatsnew-label></span></summary><ul data-whatsnew-list></ul></details>
    </div>
    <div class="acc" id="acc"></div>
    <div class="how" id="how"></div>
    <nav class="signs" aria-label="Try HappyCamper">
      <a class="ros" id="toRosters" href="#"></a>
      <a class="demo" id="toDemo" href="#"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg><div><b>In-browser demo</b><span>The quickest look at HappyCamper's core features.</span></div></a>
      <a id="toDetails" href="#"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg><div><b>Details</b><span>How the app is built, and how data is used.</span></div></a>
    </nav>
  </main>
  <footer data-foot></footer>
</div>
<script>
  function render(DL) {
    var K = window.DLkit, mine = DL.guess();
    var trust = DL.trustHTML;
    DL.trustHTML = function (k) {
      return k !== "mac" ? trust(k) : "macOS requires these steps for any app not on the App Store. See <a href=\"" + DL.trust.mac.url + "\">Apple's guide</a> for details. HappyCamper's code is open-source, <a href=\"" + DL.links.details + "\">learn more here</a>.";
    };
    function osMod(o) {
      return '<div class="mod" data-os="' + o.id + '" tabindex="0"><span class="badge more">For you</span>' + DL.svg(o.icon) +
        '<b class="short">' + o.short + '</b><b class="full">' + o.name + '</b><small class="more">' + o.sub + "</small>" +
        '<span class="more"><a class="dl" href="' + DL.url(o.file) + '">' + DL.svg("i-down") + 'Download</a><span class="file">' + o.file + "</span></span></div>";
    }
    function wire(acc, show) {
      acc.querySelectorAll(".mod").forEach(function (m) { if (m.dataset.os !== mine) { var b = m.querySelector(".badge"); if (b) b.remove(); } });
      acc.addEventListener("click", function (e) { var m = e.target.closest(".mod"); if (m && !m.classList.contains("open")) show(m.dataset.os); });
      acc.addEventListener("keydown", function (e) { var m = e.target.closest(".mod"); if (m && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); show(m.dataset.os); } });
    }

    var acc = document.getElementById("acc");
    acc.innerHTML = DL.os.map(osMod).join("");
    var m0 = acc.querySelector('[data-os="' + mine + '"]');
    m0.classList.add("mine");
    m0.querySelector(".badge").textContent = "Suggested for you";
    m0.querySelector("span.more").insertAdjacentHTML("beforeend", '<span class="guess">' + DL.svg("i-chip") + "Recommended for you</span>");
    function show(id) {
      acc.querySelectorAll(".mod").forEach(function (m) { m.classList.toggle("open", m.dataset.os === id); });
      document.getElementById("how").innerHTML = K.band(DL, DL.byId(id));
    }
    wire(acc, show);
    show(mine);
    var fp = document.querySelector("footer .footpills"); if (fp) fp.parentNode.remove();
    var r = document.getElementById("toRosters");
    r.href = DL.links.rosters;
    r.innerHTML = K.csv + "<div><b>Download demo rosters</b><span>Four sets of sample rosters to demo in the app.</span></div>";
    document.getElementById("toDemo").href = DL.links.demo;
    document.getElementById("toDetails").href = DL.links.details;
  }
</script>

/* Small shared renderers: an OS picker and a step pictogram. */
window.DLkit = {
  pic: function (step, cls) {
    return '<svg class="pic ' + (cls || "") + '" viewBox="0 0 96 64" aria-hidden="true"><use href="#' + step.pic + '"/></svg>';
  },
  picker: function (DL, current, onPick, cls) {
    var box = document.createElement("div");
    box.className = "picker " + (cls || "");
    box.setAttribute("role", "radiogroup");
    box.setAttribute("aria-label", "Your computer");
    DL.os.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "radio");
      b.dataset.os = o.id;
      b.innerHTML = DL.svg(o.icon) + '<span class="nm">' + o.name + '</span><span class="sb">' + o.sub + "</span>";
      b.addEventListener("click", function () { mark(o.id); onPick(o.id); });
      box.appendChild(b);
    });
    function mark(id) { box.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-checked", String(b.dataset.os === id)); }); }
    mark(current);
    return box;
  }
};

/* G's step band, shared by I onward. extra: optional html for one more tile. */
window.DLkit.band = function (DL, o, extra) {
  var K = window.DLkit, steps = DL.steps[o.steps];
  return '<h2>Installing on ' + o.name + '</h2><ol class="strip">' + steps.map(function (s) {
    return '<li class="' + (s.gate ? "gate" : "") + '"' + (s.more ? ' title="' + s.more.replace(/<[^>]+>/g, "") + '"' : "") + ">" + K.pic(s) + s.text + "</li>";
  }).join("") + (extra || "") + "</ol><p>" + DL.trustHTML(o.steps) + "</p>";
};
window.DLkit.csv = '<svg class="csv" viewBox="0 0 70 84" aria-hidden="true"><use href="#i-csv"/></svg>';
